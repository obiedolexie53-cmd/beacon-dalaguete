name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend (lint, migrate, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon_ci_password
          POSTGRES_DB: beacon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BEACON_ENVIRONMENT: test
      BEACON_DATABASE_URL: postgresql+psycopg://beacon:beacon_ci_password@localhost:5432/beacon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg (video metadata tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  e2e:
    name: End-to-end and accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon_ci_password
          POSTGRES_DB: beacon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://beacon:beacon_ci_password@localhost:5432/beacon_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm --filter @beacon/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t beacon-api ./backend
