# Local development services for BEACON.
#   docker compose up -d db        -> PostgreSQL + PostGIS only
#   docker compose up -d           -> database + API
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-beacon}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - beacon_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      BEACON_ENVIRONMENT: development
      BEACON_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD:-beacon_dev_password}@db:5432/${POSTGRES_DB:-beacon}
      BEACON_CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174"]'
      BEACON_MEDIA_ROOT: /data/media
      BEACON_SECRET_KEY: ${BEACON_SECRET_KEY:-change-me-dev-only-never-use-in-production}
    ports:
      - '8000:8000'
    volumes:
      - beacon_media:/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  beacon_db:
  beacon_media:
